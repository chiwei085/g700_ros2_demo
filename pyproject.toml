[project]
name = "ros2-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ruamel-yaml>=0.19.1",
]

[tool.ruff]
line-length = 80
target-version = "py310"
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
exclude = ["build", "install", "log", "src/**/*.cpp", "src/**/*.h"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
